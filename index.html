<style>
  body {
    background-color: #ffffff;
    color: black;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
  }
  button {
    background-color: #4f8cff;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 18px;
    border-radius: 10px;
    margin: 4px;
  }
  .card {
    background-color: #f2f5ff;
    border-radius: 12px;
    padding: 16px;
    margin: 12px auto;
    max-width: 340px;
    text-align: left;
  }
  .card button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 16px;
  }
</style>

<h1>GD Practice Hub</h1>
<h3 id="welcome"></h3>
<p>Practice group discussions with real people.</p>
<button id="joinBtn">Join a session</button>
<p id="message"></p>

<h2>Upcoming sessions</h2>
<div>
  <button onclick="showSessions('All')">All</button>
  <button onclick="showSessions('GD')">GD</button>
  <button onclick="showSessions('Debate')">Debate</button>
</div>
<div id="sessionList"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const db = supabase.createClient("https://sbezafoatdqodhgrpsca.supabase.co/rest/v1/", "sb_publishable_RPL5KysRewd1megD-SwkLg_qYfvsma-");

  const userName = localStorage.getItem("userName");
  if (!userName) {
    window.location.href = "login.html";
  }
  document.getElementById("welcome").textContent = "Hi, " + userName + "!";

  const btn = document.getElementById("joinBtn");
  const msg = document.getElementById("message");
  const list = document.getElementById("sessionList");

  btn.addEventListener("click", function () {
    msg.textContent = "Pick a session below to join.";
  });

  let sessions = [];

  async function loadSessions() {
    const { data, error } = await db.from("sessions").select("*").order("id");
    if (error) {
  msg.textContent = "Error: " + error.message;
  return;
    }
    sessions = data;
    showSessions("All");
  }

  function showSessions(filter) {
    list.innerHTML = "";
    sessions.forEach(function (s) {
      if (filter !== "All" && s.type !== filter) return;

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        "<b>" + s.type + "</b> · " + s.start_time +
        "<br>" + s.topic +
        "<br><button>Join</button>";

      card.querySelector("button").addEventListener("click", async function () {
        await db.from("participants").insert({ session_id: s.id, user_name: userName });
        window.location.href = "room.html?id=" + s.id + "&topic=" + encodeURIComponent(s.topic);
      });

      list.appendChild(card);
    });
  }

  loadSessions();
</script>
