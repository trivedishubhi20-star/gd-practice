<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px 20px;
    background-color: #ffffff;
    color: black;
  }
  .person {
    background-color: #f2f5ff;
    border-radius: 10px;
    padding: 12px;
    margin: 8px auto;
    max-width: 320px;
  }
  button {
    background-color: #4f8cff;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 10px;
    margin: 6px;
  }
</style>

<h2 id="topic"></h2>
<h1 id="timer">15:00</h1>

<h3 id="count"></h3>
<div id="people"></div>

<button id="muteBtn">Mute</button>
<button onclick="window.location.href='report.html'">Leave</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const db = supabase.createClient("https://sbezafoatdqodhgrpsca.supabase.co", "sb_publishable_RPL5KysRewd1megD-SwkLg_qYfvsma-");

  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("id");
  const me = localStorage.getItem("userName");
  document.getElementById("topic").textContent = params.get("topic");

  async function loadPeople() {
    const { data, error } = await db
      .from("participants")
      .select("user_name")
      .eq("session_id", sessionId)
      .order("joined_at");
    if (error) return;

    const names = [...new Set(data.map(function (p) { return p.user_name; }))];
    document.getElementById("count").textContent = names.length + " in this room";

    const box = document.getElementById("people");
    box.innerHTML = "";
    names.forEach(function (n) {
      const div = document.createElement("div");
      div.className = "person";
      div.textContent = n === me ? n + " (you)" : n;
      box.appendChild(div);
    });
  }

  loadPeople();
  setInterval(loadPeople, 4000);

  let seconds = 15 * 60;
  const timer = document.getElementById("timer");
  setInterval(function () {
    if (seconds <= 0) return;
    seconds--;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    timer.textContent = m + ":" + (s < 10 ? "0" + s : s);
  }, 1000);

  const muteBtn = document.getElementById("muteBtn");
  let muted = false;
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    muteBtn.textContent = muted ? "Unmute" : "Mute";
  });
</script>
