<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px 20px;
    background-color: #ffffff;
    color: black;
  }
  .box {
    background-color: #f2f5ff;
    border-radius: 12px;
    padding: 14px;
    margin: 10px auto;
    max-width: 340px;
    text-align: left;
  }
  .bar {
    background-color: #dde5ff;
    border-radius: 8px;
    height: 12px;
    margin-top: 6px;
  }
  .fill {
    background-color: #4f8cff;
    border-radius: 8px;
    height: 12px;
  }
  button {
    background-color: #4f8cff;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    border-radius: 10px;
    margin-top: 16px;
  }
</style>

<h3 id="who"></h3>
<h2 id="overall"></h2>

<div id="stats"></div>

<div class="box">
  <b>Feedback</b><br><br>
  ✔ Strong opening point<br>
  ✔ Good at building on others' ideas<br>
  ✘ Too many filler words<br><br>
  <b>Try next time:</b> pause briefly instead of saying "like".
</div>

<button onclick="window.location.href='index.html'">Back to home</button>

<script>
  function rnd() { return 5 + Math.floor(Math.random() * 5); }

const stats = [
  { name: "Clarity", score: rnd() },
  { name: "Relevance", score: rnd() },
  { name: "Persuasion", score: rnd() },
  { name: "Teamwork", score: rnd() }
];

  const box = document.getElementById("stats");
  let total = 0;

  stats.forEach(function (s) {
    total += s.score;
    box.innerHTML +=
      '<div class="box">' + s.name + ": " + s.score + "/10" +
      '<div class="bar"><div class="fill" style="width:' + s.score * 10 + '%"></div></div></div>';
  });

  const avg = (total / stats.length).toFixed(1);
  document.getElementById("overall").textContent = "Overall: " + avg + " / 10";
  document.getElementById("who").textContent = localStorage.getItem("userName") || "Guest";

const last = localStorage.getItem("lastScore");
if (last) {
  document.getElementById("overall").textContent += "  (last time: " + last + ")";
}
localStorage.setItem("lastScore", avg);
</script>
